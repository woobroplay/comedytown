m6:{goal:'대푯값, 분산·표준편차를 구하고 상관관계를 해석할 수 있다',cards:[['대푯값','평균=합÷개수, 중앙값=크기순 가운데(짝수 개면 가운데 두 값 평균), 최빈값=가장 많이 나온 값','4, 6, 8, 10 → 중앙값 7','짝수 개 중앙값 주의'],['분산 · 표준편차','편차=자료-평균(합은 0), 분산=편차²의 평균, 표준편차=√분산','분산 9 → 표준편차 3','클수록 흩어짐'],['상관관계','같이 커지면 양의 상관관계, 하나가 커질 때 다른 하나가 작아지면 음의 상관관계','공부 시간↑ 성적↑ = 양의 상관관계','산점도 모양 보기']],ex:{q:'2, 4, 6, 8 의 표준편차를 구해보자',steps:['평균 = 20 ÷ 4 = 5','편차: -3, -1, 1, 3','편차² 합 = 9+1+1+9 = 20 → 분산 = 20 ÷ 4 = 5','표준편차 = √5']}},
e1:{goal:'관계대명사 what(~하는 것)을 알고 that/which와 구별해서 쓴다',cards:[['what = ~하는 것','what = the thing which. 문장의 주어·목적어·보어 자리에 들어간다.','What I want is pizza. (내가 원하는 것은 피자다)','what = the thing which'],['명사 뒤엔 that / which','앞에 꾸밀 명사(선행사)가 있으면 what을 못 쓴다.','the book that I bought (O) / the book what I bought (X)','명사 뒤엔 that'],['회화 표현','자주 쓰는 what 표현들.',"That's what I mean. / Tell me what you know.",'말할 때도 많이 써']],ex:{q:'"내가 필요한 것은 잠이다"를 영어로',steps:['"내가 필요한 것" = What I need','"~은 잠이다" = is sleep','합치기: What I need is sleep.','what 덩어리가 주어 자리!']}},
e2:{goal:'현재완료(have+p.p.)의 경험·계속·완료·결과를 구별해서 쓴다',cards:[['have + p.p.','과거에 시작한 일이 지금까지 연결될 때. 3인칭 단수 주어면 has.','I have lived here for three years.','have/has + 과거분사'],['4가지 용법','경험(ever, never), 계속(for, since), 완료(just, already, yet), 결과(lost → 지금도 없음)','Have you ever been to Jeju?','for=기간, since=시작점'],['같이 못 쓰는 말','yesterday, ago, last week 같은 딱 과거 시점과는 못 쓴다.','I saw him yesterday. (O) / I have seen him yesterday. (X)','과거 시점 → 그냥 과거형']],ex:{q:'"나는 그 영화를 세 번 본 적이 있다"',steps:['경험 → 현재완료 have + p.p.','see의 p.p. = seen','I have seen the movie','three times 붙이기: I have seen the movie three times.']}},
e3:{goal:'가정법 과거로 지금 사실과 반대되는 상상을 말한다',cards:[['가정법 과거 공식','If + 주어 + 과거동사, 주어 + would/could + 동사원형','If I had money, I would buy a game.','If절은 과거, 주절은 would'],['be동사는 were','주어가 I, he, she여도 were!','If I were you, I would study.','If I were ~'],['I wish + 과거','"~라면 좋을 텐데" (사실은 아님)','I wish I were taller. (사실은 안 큼)','현재 사실의 반대']],ex:{q:'"As I am not tall, I can\'t play basketball well."을 가정법으로',steps:['현재 사실의 반대로 바꾼다','am not → were (be동사는 were)',"can't → could",'If I were tall, I could play basketball well.']}},
e4:{goal:'현재분사(-ing)와 과거분사(p.p.)를 구별하고 감정 표현을 바르게 쓴다',cards:[['-ing vs p.p.','-ing = ~하는(능동·진행), p.p. = ~된(수동·완료)','a sleeping baby / a broken window','하는 쪽 -ing, 당한 쪽 p.p.'],['감정 분사','감정을 주는 쪽은 -ing, 느끼는 사람은 p.p.','The movie was boring. / I was bored.','사람이 느끼면 -ed'],['명사 뒤에서 꾸미기','분사에 다른 말이 붙으면 명사 뒤로!','The boy playing soccer is Tom.','길게 꾸미면 뒤에서']],ex:{q:'"피아노를 치고 있는 소녀는 내 여동생이다"',steps:['소녀 = The girl','"피아노를 치고 있는" = playing the piano (능동·진행 → -ing)','길게 꾸미니까 명사 뒤에: The girl playing the piano','is my sister. → The girl playing the piano is my sister.']}},
e5:{goal:'의문문을 문장 속에 넣어 "의문사+주어+동사" 순서로 말한다',cards:[['어순 바꾸기','의문문이 문장 안으로 들어가면 의문사 + 주어 + 동사.','Where is it? → I know where it is.','주어가 먼저!'],['do / does / did 빼기','조동사 do는 빼고 동사에 시제·수를 붙인다.',"What does he want? → I don't know what he wants.",'does 빼고 wants'],['의문사가 없으면 if','Yes/No 질문은 if 또는 whether로 연결.','Is he busy? → I wonder if he is busy.','if = ~인지']],ex:{q:'"그가 왜 화가 났는지 알려줘"',steps:['원래 질문: Why is he angry?','간접의문문 어순: why + he + is','Tell me + why he is angry','Tell me why he is angry.']}},
s1:{goal:'멘델의 유전 원리(우열·분리·독립)로 자손의 비율을 구한다',cards:[['우열의 원리','순종끼리 교배하면 잡종 1대에는 우성 형질만 나타난다.','RR × rr → 모두 Rr (둥근)','나타나는 쪽 = 우성'],['분리의 법칙','생식세포를 만들 때 대립유전자가 나뉘어 들어간다. Rr 자가수분 → RR:Rr:rr = 1:2:1','둥근 : 주름 = 3 : 1','3:1 기억!'],['독립의 법칙','두 쌍 이상의 형질은 서로 영향 없이 따로 유전된다. RrYy 자가수분 → 9:3:3:1','둥글고 노랑 9 : 둥글고 초록 3 : 주름 노랑 3 : 주름 초록 1','9:3:3:1']],ex:{q:'Rr × rr 에서 주름진 완두가 나올 확률은?',steps:['Rr의 생식세포: R, r','rr의 생식세포: r','조합: Rr, rr → 1 : 1','주름(rr) = 1/2 = 50%']}},
s2:{goal:'역학적 에너지 보존과 에너지 전환을 설명하고 계산한다',cards:[['위치 · 운동 에너지','위치에너지 = 9.8 × 질량 × 높이, 운동에너지 = ½ × 질량 × 속력²','2kg, 10m → 9.8×2×10 = 196J','단위는 J'],['역학적 에너지 보존','공기저항이 없으면 위치에너지 + 운동에너지 = 일정. 떨어질수록 위치↓ 운동↑','꼭대기 위치에너지 = 바닥 직전 운동에너지','합은 그대로'],['에너지 전환','전기에너지 → 선풍기(운동), 전등(빛), 스피커(소리), 배터리 충전(화학). 전력량 = 전력 × 시간','1000W × 2h = 2000Wh','Wh = W × 시간']],ex:{q:'높이 5m에서 질량 4kg 공을 떨어뜨렸다. 바닥 직전 운동에너지는?',steps:['처음 위치에너지 = 9.8 × 4 × 5','= 196J','역학적 에너지 보존 → 위치에너지가 모두 운동에너지로','답: 196J']}},
s3:{goal:'화학 반응의 규칙(질량 보존·일정 성분비·기체 반응)과 발열·흡열을 설명한다',cards:[['물리 변화 vs 화학 변화','모양·상태만 바뀌면 물리 변화, 새 물질이 생기면 화학 변화.','얼음 녹기(물리) / 철 녹슬기(화학)','새 물질 = 화학 변화'],['질량 보존 법칙','반응 전후 질량의 합은 같다. 원자는 배열만 바뀐다.','Mg 3g + 산소 = MgO 5g → 산소 2g','빠져나간 기체 주의'],['일정 성분비 · 기체 반응 · 열','물 H:O 질량비 1:8, 수소 2 + 산소 1 → 수증기 2 (부피). 열을 내면 발열, 흡수하면 흡열.','손난로 = 발열 / 냉찜질 팩 = 흡열','1:8, 2:1:2']],ex:{q:'구리 4g을 가열해 산화 구리 5g이 되었다. 반응한 산소는?',steps:['질량 보존 법칙을 쓴다','산화 구리 = 구리 + 산소','5g = 4g + 산소','답: 1g']}},
s4:{goal:'연주 시차와 등급으로 별까지의 거리와 밝기를 비교한다',cards:[['연주 시차','지구 공전으로 별이 6개월 사이 달라 보이는 각의 1/2. 클수록 가깝다.','연주 시차 1″ = 1pc','시차↑ 거리↓'],['등급','숫자가 작을수록 밝다. 5등급 차이 = 약 100배. 겉보기 등급(보이는 밝기) vs 절대 등급(10pc에 둘 때)','1등급은 6등급보다 약 100배 밝다','작을수록 밝다'],['색과 온도 · 우주','파란 별일수록 뜨겁고 붉은 별일수록 차갑다. 태양계는 우리은하에 있고 우주는 팽창 중.','청색 > 백색 > 황색 > 적색 (온도)','파랑 = 뜨거움']],ex:{q:'겉보기 등급 1, 절대 등급 4인 별은 10pc보다 가까울까 멀까?',steps:['겉보기 등급 1 < 절대 등급 4','10pc에 둘 때보다 더 밝게 보인다','밝게 보이면 가까이 있는 것','답: 10pc보다 가깝다']}},
h1:{goal:'무신정변부터 몽골 항쟁까지 고려 후기 흐름을 순서대로 말한다',cards:[['무신정변 (1170)','문신 우대·무신 차별 → 정중부 등이 정변. 최충헌은 교정도감으로 최씨 정권.','망이·망소이의 난, 만적의 난도 이 시기','1170 무신정변'],['몽골 침입과 항쟁','1231 침입 → 강화도 천도 → 처인성 김윤후, 팔만대장경 제작','팔만대장경은 지금 합천 해인사','강화도 천도'],['삼별초와 원 간섭기','개경 환도 반대 → 삼별초가 진도·제주에서 항쟁. 이후 원 간섭기(몽골풍 유행)','고려에 퍼진 몽골 풍습 = 몽골풍','몽골풍 vs 고려양']],ex:{q:'순서대로: 강화 천도 / 무신정변 / 삼별초 항쟁 / 몽골 침입',steps:['가장 먼저 무신정변 (1170)','몽골 침입 (1231)','강화 천도 (1232)','마지막 삼별초 항쟁 (1270~)']}},
h2:{goal:'조선 건국 과정과 세종 때의 업적을 설명한다',cards:[['조선 건국','1388 위화도 회군 → 1392 이성계가 조선 건국. 정도전은 민본 사상(조선경국전).','수도는 한양','1388 → 1392'],['태종과 세종','태종은 호패법. 세종은 훈민정음(1443 창제, 1446 반포), 집현전, 측우기·앙부일구, 4군 6진.','앙부일구 = 해시계, 자격루 = 물시계','1443 창제, 1446 반포'],['성종','나라의 기본 법전 경국대전을 완성했다.','세조 때 시작 → 성종 때 완성','경국대전 = 성종']],ex:{q:'순서대로: 훈민정음 창제 / 조선 건국 / 위화도 회군 / 경국대전 완성',steps:['위화도 회군 (1388)','조선 건국 (1392)','훈민정음 창제 (1443, 세종)','경국대전 완성 (성종)']}},
h3:{goal:'두 번의 전쟁, 영조·정조, 실학, 서민 문화를 설명한다',cards:[['임진왜란 · 병자호란','1592 임진왜란: 이순신(한산도·명량). 1636 병자호란: 청의 침입.','"신에게는 아직 12척의 배가..." → 명량 대첩','1592 / 1636'],['영조와 정조','당파를 고르게 쓰는 탕평책. 정조는 규장각을 세우고 수원 화성을 쌓았다.','거중기 = 정약용','탕평책'],['실학과 서민 문화','실학: 정약용, 박지원(열하일기). 서민 문화: 판소리, 탈춤, 한글 소설, 풍속화(김홍도·신윤복)','향가는 신라 때 노래','풍속화 = 김홍도·신윤복']],ex:{q:'정조와 관련 있는 것 고르기: 규장각, 집현전, 수원 화성, 교정도감',steps:['집현전 → 세종','교정도감 → 고려 최충헌','규장각 → 정조','수원 화성 → 정조. 답: 규장각, 수원 화성']}},
h4:{goal:'개항부터 6·25 전쟁까지 근현대 사건을 연도와 함께 말한다',cards:[['개항과 대한 제국','1876 강화도 조약(불평등) → 1894 갑오개혁 → 1897 대한 제국(고종 황제)','갑오개혁 때 신분제 폐지','1876 / 1897'],['국권 피탈과 독립운동','1910 국권 피탈 → 1919 3·1 운동 → 상하이 대한민국 임시 정부','유관순 = 3·1 운동','1910 / 1919'],['광복과 대한민국','1945.8.15 광복 → 1948.8.15 정부 수립 → 1950 6·25 전쟁(인천 상륙 작전) → 1953 정전 협정','8월 15일은 광복절이자 정부 수립일','1945 / 1948 / 1950 / 1953']],ex:{q:'순서대로: 3·1 운동 / 광복 / 강화도 조약 / 대한 제국',steps:['강화도 조약 (1876)','대한 제국 (1897)','3·1 운동 (1919)','광복 (1945)']}}};
